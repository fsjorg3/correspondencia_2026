{% extends "base.html" %}

{% block menu %}
    {% include "menu.html" %}
{% endblock %}

{% block contenido %}

<h3>Vista previa del archivo</h3>

<table class="table table-bordered table-sm">
    <thead>
        <tr>
            {% for col in columnas %}
            <th>{{ col }}</th>
            {% endfor %}
        </tr>
    </thead>
    <tbody>
        {% for fila in preview %}
        <tr>
            {% for col in columnas %}
            <td>{{ fila[col] }}</td>
            {% endfor %}
        </tr>
        {% endfor %}
    </tbody>
</table>

<!-- ⭐ Botón que dispara la importación -->
<button id="btnGuardar" class="btn btn-success mt-3">Confirmar importación</button>

<!-- ⭐ Script que envía JSON a Flask -->
<script>
document.getElementById("btnGuardar").addEventListener("click", function () {
    const btn = document.getElementById("btnGuardar");
    btn.disabled = true;
    btn.innerText = "Importando...";

    fetch("{{ url_for('importar_excel_guardar') }}", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({{ preview|tojson }})
    })
    .then(r => r.json().then(data => ({ status: r.status, body: data })))
    .then(response => {
        const data = response.body;
        if (data.success) {
            alert(data.mensaje || "Importación completada");
            window.location.href = "{{ url_for('lista') }}";
        } else {
            let msgError = data.error || "Hubo un problema al importar el archivo.";
            
            if (data.detalles && data.detalles.length > 0) {
                // Imprimir con formato mejorado en la consola
                console.groupCollapsed("%c🚨 Errores de Importación (Haz clic para expandir)", "color: red; font-size: 14px; font-weight: bold;");
                console.error("Mensaje del servidor: ", data.error);
                
                // Estructurar los errores en una tabla para la consola
                const erroresTabla = data.detalles.map(err => {
                    // El regex busca el patrón: "Fila X (Folio: Y): Z" o "Fila X: Z"
                    const match = err.match(/Fila (\d+)(?:\s+\(Folio:\s*([^)]*)\))?:\s*(.*)/);
                    if (match) {
                        return { "Fila": match[1], "Folio": match[2] || "N/A", "Descripción del Error": match[3] };
                    }
                    return { "Fila": "N/A", "Folio": "N/A", "Descripción del Error": err };
                });
                
                console.table(erroresTabla);
                console.groupEnd();
                
                msgError += "\n\n👉 Por favor abre la Consola del Navegador (presiona F12 o Ctrl+Shift+I) para ver la tabla con el reporte detallado de errores.";
            }
            alert(msgError);
            btn.disabled = false;
            btn.innerText = "Confirmar importación";
        }
    })
    .catch(err => {
        alert("Error de conexión o fallo crítico al intentar importar.");
        console.error(err);
        btn.disabled = false;
        btn.innerText = "Confirmar importación";
    });

});
</script>

{% endblock %}
