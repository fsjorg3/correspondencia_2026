{% extends "base.html" %}

{% block menu %}
    {% include "menu.html" %}
{% endblock %}

{% block contenido %}

<h3>Vista previa del archivo</h3>

<table class="table table-bordered table-sm">
    <thead>
        <tr>
            {% for col in columnas %}
            <th>{{ col }}</th>
            {% endfor %}
        </tr>
    </thead>
    <tbody>
        {% for fila in preview %}
        <tr>
            {% for col in columnas %}
            <td>{{ fila[col] }}</td>
            {% endfor %}
        </tr>
        {% endfor %}
    </tbody>
</table>

<!-- ⭐ Botón que dispara la importación -->
<button id="btnGuardar" class="btn btn-success mt-3">Confirmar importación</button>

<!-- ⭐ Script que envía JSON a Flask -->
<script>
document.getElementById("btnGuardar").addEventListener("click", function () {
    const btn = document.getElementById("btnGuardar");
    btn.disabled = true;
    btn.innerText = "Importando...";

    fetch("{{ url_for('importar_excel_guardar') }}", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({{ preview|tojson }})
    })
    .then(r => r.json().then(data => ({ status: r.status, body: data })))
    .then(response => {
        const data = response.body;
        if (data.success) {
            alert(data.mensaje || "Importación completada");
            window.location.href = "{{ url_for('lista') }}";
        } else {
            let msgError = (data.error || "Error al importar") + "\n\n";
            if (data.detalles && data.detalles.length > 0) {
                // Mostrar hasta 10 errores en el alert
                msgError += "Detalles:\n- " + data.detalles.slice(0, 10).join("\n- ");
                if (data.detalles.length > 10) {
                    msgError += `\n... y ${data.detalles.length - 10} errores más.`;
                }
            }
            alert(msgError);
            btn.disabled = false;
            btn.innerText = "Confirmar importación";
        }
    })
    .catch(err => {
        alert("Error de conexión o fallo crítico al intentar importar.");
        console.error(err);
        btn.disabled = false;
        btn.innerText = "Confirmar importación";
    });

});
</script>

{% endblock %}
